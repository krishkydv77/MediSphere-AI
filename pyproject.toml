[project]
name = "chatbot2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "krishan", email = "krishkydv77@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.8.0",
    "chromadb>=0.5,<2.0",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.141.1",
    "fastmcp>=4.0.11",
    "gensim>=4.4.0",
    "google-genai>=2.28.0",
    "google-generativeai>=0.8.6",
    "groq>=0.5.0",
    "gtts>=2.3.2",
    "httpx>=0.27",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "langchain>=0.3,<1.0",
    "langchain-core>=0.3,<1.0",
    "langchain-google-genai>=2.0,<3.0",
    "langgraph>=0.2,<1.0",
    "nest-asyncio>=1.6.0",
    "nltk>=3.10.3",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "passlib[bcrypt]>=1.7.4",
    "pillow>=10.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4",
    "pymupdf>=1.24",
    "pymysql>=1.1.0",
    "pytesseract>=0.3.13",
    "pytest>=8.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=3.0,<6.0",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
chatbot2 = "chatbot2:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
